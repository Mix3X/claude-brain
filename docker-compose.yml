services:
  nasmem-db:
    image: pgvector/pgvector:pg16
    container_name: nasmem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nasmem
      # CHANGE THIS before first launch:
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: nasmem
    ports:
      - "5432:5432"
    volumes:
      - nasmem-data:/var/lib/postgresql/data
      # schema.sql runs automatically on first init (empty data dir only):
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasmem -d nasmem"]
      interval: 10s
      timeout: 5s
      retries: 5

  nasmem-web:
    build: .
    container_name: nasmem-web
    restart: unless-stopped
    depends_on:
      nasmem-db:
        condition: service_healthy
    environment:
      BRAIN_PG_HOST: nasmem-db
      BRAIN_PG_PORT: "5432"
      BRAIN_PG_USER: nasmem
      BRAIN_PG_PASSWORD: CHANGE_ME
      BRAIN_PG_DATABASE: nasmem
      BRAIN_WEB_HOST: 0.0.0.0
      BRAIN_WEB_PORT: "8787"
    ports:
      - "8787:8787"

volumes:
  nasmem-data:
